# Render Blueprint — single web service (API + React frontend)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sherlock-holmes
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GATE_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: RAG_VECTOR_INDEX
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
